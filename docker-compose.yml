version: '3.8'

services:
  # 1. BANCO DE DADOS (Usando MySQL como base, podes trocar se for SQL Server)
  db:
    image: mysql:8.0
    container_name: upfinancas_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: SenhaSuperSecreta123!
      MYSQL_DATABASE: UpFinancasDB
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # 2. API (BACKEND C#)
  api:
    build:
      context: ./UpFinancas.Api # <- Aponta para a tua pasta da API
    container_name: upfinancas_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=UpFinancasDB;User=root;Password=SenhaSuperSecreta123!;
    depends_on:
      - db

  # 3. FRONTEND (REACT)
  frontend:
    build:
      context: ./UpFinancas.Web # <- Aponta para a tua pasta do Web
    container_name: upfinancas_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  db_data: